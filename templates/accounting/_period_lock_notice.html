{% if lock_date %}
<div class="period-lock-notice" role="status" style="display:flex; align-items:center; gap:.5rem; margin:0 0 1rem; padding:.75rem 1rem; border-radius:8px; background:rgba(255,193,7,0.12); border:1px solid rgba(255,193,7,0.45); color:#ffc107; font-weight:bold;">
    <i class="fas fa-lock"></i>
    <span>الفترة مقفلة حتى <span class="en">{{ lock_date|date:"Y-m-d" }}</span> — لا يمكن إضافة أو تعديل أو حذف قيود بتاريخ في هذا اليوم أو قبله. التصحيح يتم بقيد عكسي بتاريخ مفتوح.{% if entry_locked %} <u>هذا القيد ضمن الفترة المقفلة.</u>{% endif %}</span>
</div>
{% endif %}
