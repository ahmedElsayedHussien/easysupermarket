<style>
.vn { max-width: 1150px; margin: 0 auto; display: flex; flex-direction: column; gap: 1rem; }
.vn-panel { background: var(--bg-card); border: 1px solid var(--border-default); border-radius: 12px; padding: 1rem 1.1rem; }
.vn-head { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; }
.vn-head h1 { font-size: 1.3rem; font-weight: 800; color: var(--text-primary); margin: 0; }
.vn h2 { font-size: 1rem; font-weight: 800; color: var(--text-primary); margin: 0 0 .6rem; }
.note { font-size: .82rem; color: var(--text-muted); margin: .35rem 0 0; }
.vn-btn { padding: .42rem .85rem; border-radius: 8px; border: 1px solid var(--border-bright); background: var(--bg-secondary); color: var(--text-primary); font-weight: 700; font-size: .84rem; text-decoration: none; cursor: pointer; display: inline-block; }
.vn-btn.primary { background: var(--neon-orange); border-color: var(--neon-orange); color: #fff; }
.vn-btn.green { background: var(--neon-green); border-color: var(--neon-green); color: #062; }
.vn-btn.danger { color: var(--neon-red); border-color: var(--neon-red); background: transparent; }
.tabs { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .6rem; align-items: center; }
.tabs a { padding: .3rem .8rem; border-radius: 999px; font-size: .8rem; font-weight: 700; text-decoration: none; background: var(--bg-secondary); color: var(--text-muted); }
.tabs a.on { background: var(--neon-orange); color: #fff; }
.tbl { width: 100%; border-collapse: collapse; font-size: .85rem; }
.tbl th { color: var(--text-muted); font-weight: 700; font-size: .76rem; padding: .5rem .4rem; border-bottom: 1px solid var(--border-bright); text-align: center; }
.tbl td { padding: .5rem .4rem; border-bottom: 1px solid var(--border-default); text-align: center; color: var(--text-primary); font-variant-numeric: tabular-nums; }
.tbl td:first-child, .tbl th:first-child { text-align: right; }
.st { font-size: .72rem; font-weight: 800; padding: .12rem .55rem; border-radius: 999px; background: var(--bg-secondary); color: var(--text-muted); white-space: nowrap; }
.st.PENDING { background: rgba(251,191,36,.15); color: var(--neon-gold); }
.st.APPROVED { background: rgba(0,229,255,.12); color: var(--neon-cyan); }
.st.ISSUED, .st.RECEIVED { background: rgba(46,213,115,.15); color: var(--neon-green); }
.st.CANCELLED { background: rgba(255,71,87,.12); color: var(--neon-red); }
.vn select, .vn input, .vn textarea { background: var(--bg-input); border: 1px solid var(--border-bright); color: var(--text-primary); border-radius: 8px; padding: .38rem .5rem; font-size: .84rem; }
.frm { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: .6rem; align-items: end; }
.frm label { display: flex; flex-direction: column; gap: .25rem; font-size: .76rem; color: var(--text-muted); font-weight: 700; }
.meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: .5rem; margin-top: .7rem; }
.meta div { background: var(--bg-secondary); border-radius: 8px; padding: .5rem .7rem; font-size: .76rem; color: var(--text-muted); font-weight: 700; }
.meta b { display: block; font-size: .92rem; color: var(--text-primary); margin-top: .15rem; }
.warn { color: var(--neon-red); font-weight: 700; }
.qty-in { width: 6.5rem; text-align: center; }
.actions { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .8rem; }
@media print { .no-print, .sidebar, header { display: none !important; } .vn-panel { border: none; } }
</style>
