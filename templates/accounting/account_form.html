{% extends 'core/generic_form.html' %}

{% block extra_js %}
{{ form.parent_type_map|json_script:"parent-type-map" }}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const typeSelect = document.getElementById('id_account_type');
    const parentSelect = document.getElementById('id_parent');
    
    if (!typeSelect || !parentSelect) return;

    // JSON Map of { parent_account_id: account_type }
    const parentMap = JSON.parse(document.getElementById('parent-type-map').textContent);

    function filterParents() {
        const selectedType = typeSelect.value;
        const currentParentVal = parentSelect.value;
        let isCurrentParentValid = false;

        Array.from(parentSelect.options).forEach(option => {
            if (!option.value) {
                // Keep placeholder option (---------)
                option.style.display = '';
                option.disabled = false;
                return;
            }

            const parentType = parentMap[option.value];
            if (!selectedType || parentType === selectedType) {
                option.style.display = '';
                option.disabled = false;
                if (option.value === currentParentVal) {
                    isCurrentParentValid = true;
                }
            } else {
                option.style.display = 'none';
                option.disabled = true;
            }
        });

        // Reset parent selection if the previously selected parent belongs to a different type
        if (currentParentVal && !isCurrentParentValid) {
            parentSelect.value = '';
        }
    }

    function syncTypeFromParent() {
        const parentVal = parentSelect.value;
        if (parentVal && parentMap[parentVal]) {
            const expectedType = parentMap[parentVal];
            if (typeSelect.value !== expectedType) {
                typeSelect.value = expectedType;
                filterParents();
            }
        }
    }

    typeSelect.addEventListener('change', filterParents);
    parentSelect.addEventListener('change', syncTypeFromParent);

    // Run on initial page load
    filterParents();
});
</script>
{% endblock %}
